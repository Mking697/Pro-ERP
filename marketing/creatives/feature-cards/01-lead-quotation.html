Headline: From First Contact to Quotation
Supporting copy: Capture leads, move them through a real pipeline, and send GST-ready quotations — all tracked to one customer record.
CTA: Explore Lead FMS →
Visual concept: Square card, chart-trending-up glyph in rounded tile, module name, one-line value prop.

<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Pro ERP Feature Card - Lead & Quotation</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#05070d;}

.card{width:800px;height:800px;background:linear-gradient(135deg,#0a0f1e 0%,#111a2e 55%,#162238 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:56px;text-align:center;}
.card::before{content:"";position:absolute;top:-140px;right:-140px;width:360px;height:360px;
  background:radial-gradient(circle,#4f8cff2e,transparent 70%);border-radius:50%;}
.glyph{width:120px;height:120px;border-radius:28px;background:#4f8cff1f;border:1px solid #4f8cff55;
  display:flex;align-items:center;justify-content:center;font-size:58px;margin-bottom:34px;z-index:2;}
.module{font-size:34px;font-weight:800;z-index:2;}
.value{font-size:19px;color:#b9c3d6;margin-top:16px;max-width:88%;line-height:1.5;z-index:2;}
.footer{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:center;z-index:2;}

.wordmark{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:20px;letter-spacing:0.5px;color:#fff;}
.wordmark span{color:#7dd3fc;}

</style></head>
<body>
<div class="card">
  <div class="glyph">📈</div>
  <div class="module">Lead & Quotation</div>
  <div class="value">Capture leads, move them through a real pipeline, and send GST-ready quotations — all tracked to one customer record.</div>
  <div class="footer"><div class="wordmark">Pro<span>ERP</span></div></div>
</div>
</body></html>
