<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Pro ERP Launch Announcement</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#05070d;}

.card{width:1200px;height:1200px;background:linear-gradient(135deg,#0a0f1e 0%,#111a2e 55%,#162238 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  padding:72px 80px;}
.card::before{content:"";position:absolute;top:-180px;left:-180px;width:520px;height:520px;

.badge{display:inline-block;background:#4f8cff22;color:#7dd3fc;font-size:16px;font-weight:800;

.headline{font-size:72px;font-weight:900;margin-top:30px;text-align:center;z-index:2;}
.sub{font-size:22px;color:#b9c3d6;margin-top:20px;max-width:80%;text-align:center;line-height:1.5;z-index:2;}
.imgwrap{margin-top:40px;z-index:2;flex:1;display:flex;align-items:center;}
.imgwrap img{width:880px;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,0.6);border:1px solid #243150;}
.chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:32px;z-index:2;}
.chip{background:#111a2e;border:1px solid #27365a;color:#c8d1e8;font-size:14px;font-weight:600;
  padding:8px 16px;border-radius:18px;}
.footer{margin-top:34px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;}

.wordmark{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:26px;letter-spacing:0.5px;color:#fff;}
.wordmark span{color:#7dd3fc;}

<div class="card">
