<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Pro ERP IG Post - Your Factory Floor. In Your Pocket.</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#05070d;}

.card{width:1080px;height:1080px;background:linear-gradient(135deg,#0a0f1e 0%,#111a2e 55%,#162238 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
  position:relative;overflow:hidden;display:flex;flex-direction:column;padding:64px 64px 48px;}
.card::after{content:"";position:absolute;bottom:-160px;left:-160px;width:460px;height:460px;
  background:radial-gradient(circle,#4f8cff2e,transparent 70%);border-radius:50%;}
.tag{display:inline-block;background:#4f8cff22;color:#7dd3fc;font-size:14px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border-radius:20px;border:1px solid #4f8cff55;width:fit-content;z-index:2;}
.headline{font-size:56px;font-weight:800;line-height:1.12;margin-top:28px;max-width:95%;z-index:2;}
.sub{font-size:22px;color:#b9c3d6;margin-top:18px;max-width:92%;z-index:2;line-height:1.4;}
.imgwrap{flex:1;margin-top:34px;display:flex;align-items:center;justify-content:center;z-index:2;position:relative;}
.imgwrap img{max-width:100%;max-height:420px;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,0.55);border:1px solid #243150;}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:28px;z-index:2;}

.wordmark{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:26px;letter-spacing:0.5px;color:#fff;}
.wordmark span{color:#7dd3fc;}

</style></head>
<body>
<div class="card">
  <span class="tag">Mobile Ready</span>
  <div class="headline">Your Factory Floor. In Your Pocket.</div>
  <div class="sub">Full dashboard, fully responsive, on any device.</div>
  <div class="imgwrap"><img src="../../screenshots/15-dashboard-mobile.png" alt="Pro ERP screenshot"></div>
  <div class="footer"><div class="wordmark">Pro<span>ERP</span></div><div style="font-size:14px;color:#5f6c85;">pro-erp-chi.vercel.app</div></div>
</div>
</body></html>
